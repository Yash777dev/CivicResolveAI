[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicresolve-backend"
version = "1.0.0"
description = "CivicResolve AI — Autonomous Grievance Redressal System Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CivicResolve AI Team" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
